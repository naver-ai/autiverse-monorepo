[tool.coverage.run]
branch = true
source = [ "backend" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/backend/html'
 --cov-report xml:'../../coverage/apps/backend/coverage.xml'
 --html='../../reports/apps/backend/unittests/html/index.html'
 --junitxml='../../reports/apps/backend/unittests/junit.xml'
"""

[tool.poetry]
name = "backend"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "backend"

  [tool.poetry.dependencies]
  python = ">=3.12,<3.13"
  langchain = {extras = ["openai"], version = "^0.3.25"}
  dotenv = "^0.9.9"
  pendulum = "^3.1.0"
  fastapi = {extras = ["standard"], version = "^0.115.12"}
  sqlmodel = "^0.0.24"
  greenlet = "^3.2.3"
  aiosqlite = "^0.21.0"
  pyjwt = "^2.10.1"
  bcrypt = "^4.3.0"
  nanoid = "^2.0.0"
  python-socketio = "^5.13.0"
  questionary = "^2.1.0"
  alembic = "^1.16.4"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
